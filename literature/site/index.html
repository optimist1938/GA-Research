<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a reading desk. Sticky search bar on top, a facet rail on the left, one dense paper list on
     the right; the rail folds into a disclosure on phones. Colours are cool paper neutrals with a garnet
     accent reserved for "core" papers and active controls; amber marks the inbox. */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #1c2330;
    --muted: #5c6577;
    --line: #d9dde5;
    --accent: #8a2f3e;
    --accent-soft: #f3e3e6;
    --amber: #9a6400;
    --amber-soft: #fbefd3;
    --neutral-soft: #e8ebf0;
    --focus: #2b5db8;
    --display: "Spectral", Georgia, "Times New Roman", serif;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151920; --surface: #1d222b; --fg: #e6e9ef; --muted: #9aa3b5; --line: #323948;
      --accent: #e08a97; --accent-soft: #3a252a; --amber: #e2b45a; --amber-soft: #3a3020;
      --neutral-soft: #2a3040; --focus: #8ab0ee; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151920; --surface: #1d222b; --fg: #e6e9ef; --muted: #9aa3b5; --line: #323948;
    --accent: #e08a97; --accent-soft: #3a252a; --amber: #e2b45a; --amber-soft: #3a3020;
    --neutral-soft: #2a3040; --focus: #8ab0ee; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

  header.bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  }
  header.bar h1 { font-family: var(--display); font-weight: 600; font-size: 1.25rem; margin: 0; letter-spacing: 0.01em; white-space: nowrap; }
  header.bar h1 small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 0.8rem; margin-left: 8px; }
  .search { flex: 1 1 260px; min-width: 0; display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tabs button .n { font-family: var(--mono); font-size: 0.78rem; color: inherit; opacity: 0.75; margin-left: 4px; }

  .wrap {
    display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 1280px; margin: 0 auto;
  }
  aside details { border: 0; }
  aside summary { display: none; }
  .facet { margin-bottom: 20px; }
  .facet h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .facet label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; font-size: 0.92rem; }
  .facet label .n { margin-left: auto; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facet select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .facet .clear { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 0.85rem; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; color: var(--muted); font-size: 0.9rem; }
  .toolbar select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .toolbar .count { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  article.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
  article.paper.core { border-left: 4px solid var(--accent); }
  article.paper.inbox { border-left: 4px solid var(--amber); }
  .paper h3 { font-family: var(--display); font-weight: 600; font-size: 1.08rem; line-height: 1.3; margin: 0; text-wrap: balance; }
  .paper h3 a { text-decoration: none; }
  .paper h3 a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 0.88rem; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .meta .date { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .summary { margin: 0; max-width: 72ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--neutral-soft); color: var(--fg); border: 0; cursor: pointer; }
  .chip.rel-core { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip.rel-adjacent { background: var(--amber-soft); color: var(--amber); font-weight: 600; }
  .chip.rel-context { background: var(--neutral-soft); color: var(--muted); font-weight: 600; }
  .chip.score { font-family: var(--mono); background: var(--amber-soft); color: var(--amber); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.85rem; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .links a:hover { text-decoration: underline; }
  .id { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
  .triage { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 6px; font-size: 0.85rem; }
  .triage code { font-family: var(--mono); font-size: 0.78rem; background: var(--bg); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
  .triage .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .triage button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 0.8rem; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  .foot { color: var(--muted); font-size: 0.82rem; margin-top: 28px; max-width: 72ch; }
  .foot code { font-family: var(--mono); font-size: 0.78rem; }

  @media (max-width: 760px) {
    .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    aside details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 12px; }
    aside summary { display: block; cursor: pointer; font-weight: 600; }
    aside details[open] summary { margin-bottom: 8px; }
    header.bar h1 small { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) { article.paper { transition: border-color 120ms; } }
</style>

      <div class="links">${links}<span class="id">${esc(p.id)}</span></div>
      ${triage}`;
    el.querySelectorAll('[data-topic]').forEach(b => b.addEventListener('click', () => { state.topics.clear(); state.topics.add(b.dataset.topic); render(); }));
    el.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
      const text = b.dataset.copy; const done = () => { b.textContent = 'copied'; setTimeout(() => { b.textContent = b.textContent === 'copied' ? (text.includes(' accept ') ? 'copy accept command' : 'copy reject command') : b.textContent; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => { window.getSelection().selectAllChildren(b.parentElement); });
    }));
    return el;
  }
  function render() {
    renderFacets();
    document.querySelectorAll('#tabs button').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.status === state.status));
      b.querySelector('.n').textContent = papers.filter(p => p.status === b.dataset.status).length;
    });
    let items = pool().filter(p => matches(p));
    const by = { 'date-desc': (a, b) => String(b.date).localeCompare(String(a.date)), 'date-asc': (a, b) => String(a.date).localeCompare(String(b.date)), 'title': (a, b) => a.title.localeCompare(b.title), 'score': (a, b) => ((b.triage || {}).score || 0) - ((a.triage || {}).score || 0) };
    items.sort(by[state.sort] || by['date-desc']);
    $('count').textContent = items.length + ' of ' + pool().length + ' ' + state.status + ' papers';
    const list = $('list'); list.innerHTML = '';
    if (!items.length) { list.innerHTML = '<div class="empty">Nothing matches these filters.</div>'; }
    for (const p of items) list.append(card(p));
    $('foot').innerHTML = state.status === 'inbox'
      ? 'Inbox items were found by the weekly sweep and scored by keyword overlap; nothing here is accepted automatically. Review each, then run the copied command (or edit <code>papers.yaml</code>) and <code>python -m ga_lit render</code>.'
      : 'Source of truth: <code>literature/papers.yaml</code>. Relevance <b>core</b> = geometric algebra inside the model or method, <b>adjacent</b> = GA-related machine learning, <b>context</b> = cites or benchmarks against GA models.';
  }
  $('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $('year').addEventListener('change', e => { state.year = e.target.value; render(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; try { localStorage.setItem('ga-lit-sort', state.sort); } catch (err) {} render(); });
  $('clear').addEventListener('click', () => { state.relevance.clear(); state.topics.clear(); state.venue.clear(); state.year = ''; state.q = ''; $('q').value = ''; render(); });
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { state.status = b.dataset.status; try { history.replaceState(null, '', '#' + state.status); } catch (e) {} render(); }));
  if (window.matchMedia('(max-width: 760px)').matches) $('facets').open = false;
  render();
})();
</script>

</body>
</html>
