[tool.poetry]
name = "dpd"
description = "Multi-band digital predistortion (Huawei 3-band task) with geometric-algebra models"
version = "0.1.0"
packages = [{ include = "dpd" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

numpy = "^2.0"
scipy = "^1.13"
torch = "2.9.0"
matplotlib = "3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
