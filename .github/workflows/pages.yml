name: Publish literature page

# Deploys literature/site/ (the rendered literature browser) to GitHub Pages whenever it changes on main,
# so https://chagrygoris.github.io/GA-Research/ always shows the current database.
# One-time setup in the repository: Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "literature/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # enable Pages on first run if the token is allowed to; otherwise enable it once in Settings -> Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: literature/site
      - id: deployment
        uses: actions/deploy-pages@v4
